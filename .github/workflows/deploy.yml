name: Deploy to Production

on:
  push:
    branches:
      - feature/deploy-remnutri

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting deployment..."
            
            # Navigate to project directory
            cd /var/www/rem-nutri/HealthChatApp
            
            # Pull latest code
            echo "📥 Pulling latest code from GitHub..."
            git fetch origin
            git checkout feature/deploy-remnutri
            git pull origin feature/deploy-remnutri
            
            # Install backend dependencies
            echo "📦 Installing backend dependencies..."
            cd backend
            npm install
            
            # Install and build frontend
            echo "🎨 Building frontend..."
            cd ../frontend
            npm install
            npm run build
            
            # Restart backend with PM2
            echo "♻️ Restarting backend..."
            cd ../backend
            pm2 restart health-chat-backend || pm2 start server.js --name health-chat-backend
            
            echo "✅ Deployment completed successfully!"
            echo "🌐 Your website is live at: https://remnutri.com"
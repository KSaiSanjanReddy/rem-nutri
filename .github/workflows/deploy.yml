name: Deploy to Production Server

# Only run on push to main branch and feature/deploy-remnutri branch
on:
  push:
    branches: [ main, feature/deploy-remnutri ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
      
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Run backend tests (if any)
      working-directory: ./backend
      run: npm test --if-present
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # Navigate to project directory
          cd /var/www/rem-nutri/HealthChatApp
          
          # Pull latest code
          git fetch origin
          git reset --hard origin/feature/deploy-remnutri
          
          # Install backend dependencies
          cd backend
          npm ci --production
          
          # Restart PM2 services
          pm2 restart health-chat-api
          pm2 save
          
          # Check if services are running
          pm2 status
          
          echo "✅ Deployment completed successfully!"
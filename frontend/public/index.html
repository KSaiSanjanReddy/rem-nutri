<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="description" content="Rem Nutri - Connect with doctors and health professionals" />
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="email=no">
    <meta name="format-detection" content="address=no">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Rem Nutri - Your Health Companion</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body, #root, .App {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Professional spacing for dashboard */
      .dashboard-container {
        padding: 1.5rem;
        max-width: 100%;
        margin: 0 auto;
      }
      
      /* Reduce excessive spacing */
      .space-y-6 > * + * {
        margin-top: 1rem;
      }
      
      .space-y-4 > * + * {
        margin-top: 0.75rem;
      }
      
      /* Make header more compact */
      header {
        height: 3.5rem !important;
        padding: 0.75rem 1.5rem !important;
      }
      
      /* Ensure proper alignment */
      main {
        padding: 0 !important;
        margin: 0 !important;
      }
      
      /* Remove any default margins/padding that might cause misalignment */
      .lg\:pl-64, .lg\:ml-0 {
        margin-left: 0 !important;
        padding-left: 0 !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
